name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Format, analyze and smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Check out the branch
        uses: actions/checkout@v4

      - name: Install the Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Refuse a committed .env
        run: |
          if git ls-files --error-unmatch .env > /dev/null 2>&1; then
            echo "::error file=.env::.env is tracked by git. Secrets must not be committed."
            exit 1
          fi
          echo "No .env is tracked."

      - name: Smoke test the search
        run: |
          set -euo pipefail

          echo "--- searching for 'eng' ---"
          matches=$(dart main/main.dart eng)
          echo "$matches"
          grep -q 'Found 3 match(es) for "eng":' <<< "$matches"

          echo "--- searching for a two-word phrase ---"
          phrase=$(dart main/main.dart cape town)
          echo "$phrase"
          grep -q 'Found 1 match(es) for "cape town":' <<< "$phrase"

          echo "--- searching with no query lists everyone ---"
          everyone=$(dart main/main.dart)
          echo "$everyone"
          grep -q 'All 5 team members:' <<< "$everyone"

          echo "--- a query that matches nobody still exits cleanly ---"
          none=$(dart main/main.dart zzzz)
          echo "$none"
          grep -q 'Found 0 match(es) for "zzzz":' <<< "$none"
